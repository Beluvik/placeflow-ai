name: Package main branch
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build source ZIP
        run: |
          zip -r placeflow-ai-main.zip . \
            -x ".git/*" \
            -x ".env" \
            -x ".env.*" \
            -x "appeal_audit.json" \
            -x "__pycache__/*" \
            -x ".pytest_cache/*"
      - uses: actions/upload-artifact@v4
        with:
          name: placeflow-ai-main
          path: placeflow-ai-main.zip
          if-no-files-found: error
          retention-days: 7
